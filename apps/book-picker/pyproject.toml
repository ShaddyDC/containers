[project]
name = "book-picker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-generativeai>=0.8.5",
    "requests>=2.32.3",
]

[tool.uv]
# Supply-chain cooldown: resolve only releases at least a week old.
exclude-newer = "7 days"
# Except certifi: it is the trust store, and its fixes (like 2026.10.19, the compromised eMudhra
# CAs) should not wait a week.
exclude-newer-package = { certifi = false }
